[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "emilia"
version = "5.0.0"
dependencies = [
    "ollama",
    "ddgs",
    "kopilogs",
    "trafilatura",
    "pyaudio",
    "openai-whisper",
    "kokoro",
    "numpy",
]
requires-python = ">=3.12,<3.14"

[project.scripts]
emilia = "emilia.main:main"

[tool.kuvy.run-paths]
main = "src/emilia/main.py"
tests = "tests/tests.py"
